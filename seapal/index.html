<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seapal</title>
    <link href="https://googleapis.com" rel="stylesheet" />

    <!-- Start Single Page Apps for GitHub Pages Routing Script -->
    <script type="text/javascript">
      (function(l) {
        if (l.search.slice(0, 3) === '?p=') {
          var decoded = l.search.slice(3).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          
          // FIX: Added + '/' + right here to keep the route separated from your folder name
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + '/' + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <!-- End Single Page Apps for GitHub Pages Routing Script -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
