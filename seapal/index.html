    <!-- Start Single Page Apps for GitHub Pages Option Script -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[0] === '?') {
          var query = l.search.slice(1).split('&').reduce(function (q, v) {
            var d = v.split('=');
            q[d[0]] = d.slice(1).join('=').replace(/~and~/g, '&');
            return q;
          }, {});
          if (query.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (query.p || '') +
              (query.q ? ('?' + query.q) : '') +
              l.hash
            );
          }
        }
      }(window.location));
    </script>
    <!-- End Single Page Apps for GitHub Pages Option Script -->

  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
