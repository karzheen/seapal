<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seapal</title>
    <link href="https://googleapis.com" rel="stylesheet" />
    
    <style>
      #root { display: none; }
      .pre-loading-screen { position: fixed; inset: 0; background-color: #ffffff; z-index: 99999; }
    </style>

    <!-- SPA Routing Redirect Script -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // Kept at 1 for the /seapal/ subdirectory
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div id="loading-screen-gate" class="pre-loading-screen"></div>
    <div id="root"></div>
    <!-- Vite bundle injection script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
